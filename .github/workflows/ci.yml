name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Glass controls use APIs from the macOS 27 SDK, which only the Xcode 27 image provides so far.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Unit tests
        run: swift test
      - name: Card layout probe
        run: bash scripts/check-card-layout.sh
      - name: Build app bundle
        run: bash scripts/build-app.sh
